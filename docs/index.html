<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microphone Browser</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --border: #e0e3e9;
    --border-soft: #eceef3;
    --text: #14171c;
    --muted: #666f7d;
    --faint: #949cab;
    --accent: #2f6df6;
    --accent-soft: #e8effe;
    --chip: #eef0f4;
    --shadow: 0 1px 2px rgba(16, 22, 34, .06);
    /* Categorical series, fixed slot order — validated for CVD separation
       against this surface. Never cycled, never reassigned by rank. */
    --s1: #2a78d6;  /* condenser */
    --s2: #eb6834;  /* dynamic   */
    --s3: #1baf7a;  /* ribbon    */
    --s4: #eda100;  /* other     */
    --s5: #e87ba4;  /* hybrid    */
    --grid: #e6e9ef;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101215;
      --panel: #171a1f;
      --panel-2: #1c2026;
      --border: #2a2f38;
      --border-soft: #23272e;
      --text: #e6e9ee;
      --muted: #99a2b0;
      --faint: #6d7684;
      --accent: #6f9cff;
      --accent-soft: #1d2a44;
      --chip: #232830;
      --shadow: none;
      /* Same hues, re-stepped for the dark surface — not an automatic flip. */
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s5: #d55181;
      --grid: #262b33;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101215;
    --panel: #171a1f;
    --panel-2: #1c2026;
    --border: #2a2f38;
    --border-soft: #23272e;
    --text: #e6e9ee;
    --muted: #99a2b0;
    --faint: #6d7684;
    --accent: #6f9cff;
    --accent-soft: #1d2a44;
    --chip: #232830;
    --shadow: none;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --grid: #262b33;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .brandmark { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .brandmark small { display: block; font-weight: 400; font-size: 11px; color: var(--faint); letter-spacing: 0; }
  #search {
    flex: 1; max-width: 460px;
    padding: 7px 11px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .nav { display: flex; gap: 2px; flex: none; }
  .navlink {
    padding: 6px 12px; border-radius: 7px; font-size: 13px;
    color: var(--muted); text-decoration: none; white-space: nowrap;
  }
  .navlink:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
  .navlink.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .patbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .pat {
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; cursor: pointer; color: var(--muted);
  }
  .pat:hover { border-color: var(--accent); color: var(--text); }
  .pat.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pat svg { width: 21px; height: 21px; display: block; }
  .pat svg .fillp { fill: currentColor; opacity: .8; }
  .pat svg .strokep { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .8; }
  .pat.on svg .fillp, .pat.on svg .strokep { opacity: 1; }

  .spacer { flex: 1; }
  .stat { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .iconbtn {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  .iconbtn:hover { border-color: var(--accent); }

  /* ---------- layout ---------- */
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 290px 340px minmax(0, 1fr);
    gap: 1px;
    background: var(--border);
  }
  .pane { background: var(--bg); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .pane-head {
    flex: none; padding: 9px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 8px;
    min-height: 38px;
  }
  .pane-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
  .pane-head .sub { font-size: 12px; color: var(--muted); margin-left: auto; }
  .pane-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

  /* ---------- brand tree ---------- */
  .brand { border-bottom: 1px solid var(--border-soft); }
  .brand-row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px 7px 6px; cursor: pointer; user-select: none;
  }
  .brand-row:hover { background: var(--panel-2); }
  .brand.sel > .brand-row { background: var(--accent-soft); }
  .twisty {
    flex: none; width: 18px; height: 18px; display: grid; place-items: center;
    color: var(--faint); font-size: 10px; transition: transform .12s ease; border-radius: 4px;
  }
  .brand.open .twisty { transform: rotate(90deg); }
  .brand-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .count { flex: none; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .brand-kids { display: none; padding-bottom: 4px; }
  .brand.open .brand-kids { display: block; }
  .leaf {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px 4px 30px; cursor: pointer;
    font-size: 13px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .leaf:hover { background: var(--panel-2); color: var(--text); }
  .leaf.sel { background: var(--accent-soft); color: var(--text); font-weight: 500; }
  .leaf .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }

  /* Transducer colour coding — one mapping shared by tree dots, list chips and
     charts, so a type keeps its hue everywhere. Always paired with its label. */
  .t-condenser { background: var(--s1); }
  .t-dynamic   { background: var(--s2); }
  .t-ribbon    { background: var(--s3); }
  .t-boundary  { background: var(--s4); }
  .t-hybrid    { background: var(--s5); }
  .t-unknown   { background: var(--faint); }

  /* ---------- model list ---------- */
  .filters {
    flex: none; display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .frow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .frow .push { margin-left: auto; }
  .chip {
    border: 1px solid var(--border); background: var(--panel-2);
    border-radius: 999px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; color: var(--muted);
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.clear { border-style: dashed; }
  .filters select {
    font-size: 11.5px; padding: 3px 6px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .filters select.on { border-color: var(--accent); color: var(--text); }
  .showmore {
    display: block; width: calc(100% - 22px); margin: 10px 11px 16px;
    padding: 7px; font-size: 12px; cursor: pointer; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
  }
  .showmore:hover { border-color: var(--accent); color: var(--text); }
  .card {
    display: flex; gap: 10px; padding: 9px 11px;
    border-bottom: 1px solid var(--border-soft); cursor: pointer;
  }
  .card:hover { background: var(--panel-2); }
  .card.sel { background: var(--accent-soft); }
  .card .thumb {
    flex: none; width: 54px; height: 54px; border-radius: 6px;
    background: var(--chip); display: grid; place-items: center; overflow: hidden;
  }
  .card .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card .info { min-width: 0; flex: 1; }
  .card .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .desc { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tag {
    font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    background: var(--chip); color: var(--muted); white-space: nowrap;
  }
  .tag.price { color: var(--text); font-variant-numeric: tabular-nums; }
  .tag.disc { color: #d97706; }
  .tag.type { color: #fff; }
  .card .brandline { font-size: 11px; color: var(--faint); }

  /* ---------- detail ---------- */
  .detail { padding: 20px 24px 60px; max-width: 900px; }
  .detail h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -.015em; }
  .detail .sub { color: var(--muted); margin-bottom: 12px; }
  .hero { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap; }
  .hero .photo {
    flex: none; width: 180px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--border); padding: 10px; display: grid; place-items: center;
  }
  .hero .photo img { max-width: 100%; height: auto; }
  .hero .facts { flex: 1; min-width: 240px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .price { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .price small { font-size: 12px; font-weight: 400; color: var(--muted); }

  section.block { margin-top: 20px; }
  section.block > h3 {
    margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--faint); font-weight: 600;
  }
  .kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 4px 16px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .prose { color: var(--text); }
  .prose p { margin: 0 0 10px; }
  .prose ul { margin: 0 0 10px; padding-left: 20px; }
  blockquote {
    margin: 0 0 10px; padding: 8px 0 8px 12px;
    border-left: 3px solid var(--border); color: var(--muted);
  }
  blockquote cite { display: block; margin-top: 5px; font-size: 12px; color: var(--faint); font-style: normal; }
  .rel { display: flex; flex-wrap: wrap; gap: 8px; }
  .rel-item {
    display: flex; gap: 8px; align-items: center; width: 260px;
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); cursor: pointer;
  }
  .rel-item:hover { border-color: var(--accent); }
  .rel-item img { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .rel-item .n { font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .rel-item .n span { display: block; color: var(--faint); font-size: 11px; }
  .graphs { display: flex; flex-wrap: wrap; gap: 12px; }
  .graph { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--panel); }
  .graph img { display: block; max-width: 260px; height: auto; background: #fff; border-radius: 4px; }
  .graph .cap { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .linklist { list-style: none; margin: 0; padding: 0; }
  .linklist li { padding: 3px 0; }
  .linklist .lt { font-size: 11px; color: var(--faint); margin-left: 6px; }
  table.raw { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.raw th, table.raw td {
    border: 1px solid var(--border); padding: 5px 8px;
    text-align: left; vertical-align: top; white-space: pre-line;
  }
  table.raw th { background: var(--panel-2); color: var(--muted); font-weight: 600; }
  details.rawdump > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }

  /* ---------- statistics view ---------- */
  .statsview { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 26px 70px; }
  .statswrap { max-width: 1180px; margin: 0 auto; }
  .statsview h2.vh {
    margin: 30px 0 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--faint); font-weight: 600;
  }
  .statsview h2.vh:first-child { margin-top: 0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .tile .n { font-size: 25px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .tile .sub2 { font-size: 11px; color: var(--faint); margin-top: 3px; }

  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); gap: 12px; }
  figure.fig {
    margin: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px 16px; box-shadow: var(--shadow);
  }
  figure.fig.wide { grid-column: 1 / -1; }
  figure.fig figcaption { margin-bottom: 2px; font-weight: 600; font-size: 13.5px; }
  figure.fig .note { font-size: 11.5px; color: var(--faint); margin-bottom: 12px; }
  .figbar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .figbar select {
    font-size: 11.5px; padding: 3px 6px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }

  /* Horizontal bars: label · track · value. 4px rounded data-end on the
     free end only, so every bar stays anchored to a common baseline. */
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: var(--labelw, 122px) 1fr auto; gap: 10px; align-items: center; }
  .row .rl { font-size: 12.5px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rl.link { cursor: pointer; }
  .row .rl.link:hover { color: var(--accent); }
  .track { height: 15px; display: flex; gap: 2px; background: var(--grid); border-radius: 0 4px 4px 0; overflow: hidden; }
  .track > b { display: block; height: 100%; min-width: 1px; }
  .track > b:last-child { border-radius: 0 4px 4px 0; }
  .row .rv { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; min-width: 44px; }
  .row .rv small { color: var(--faint); font-size: 11px; }

  /* Vertical histogram */
  .hist { display: flex; align-items: flex-end; gap: 4px; height: 150px; }
  .hist .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .hist .col b { display: block; background: var(--s1); border-radius: 4px 4px 0 0; min-height: 2px; }
  .hist .col em { display: block; font-style: normal; font-size: 11px; color: var(--text); text-align: center; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .histx { display: flex; gap: 4px; margin-top: 6px; }
  .histx span { flex: 1; text-align: center; font-size: 10.5px; color: var(--faint); }

  /* Data explorer */
  .expbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .expbar input, .expbar select {
    font-size: 12.5px; padding: 5px 8px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 7px;
  }
  .expbar input { min-width: 190px; }
  .expbar .grow { flex: 1; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.data th {
    position: sticky; top: 0; z-index: 1;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    padding: 8px 10px; text-align: left; white-space: nowrap; cursor: pointer;
    font-weight: 600; color: var(--muted);
  }
  table.data th:hover { color: var(--text); }
  table.data th .ind { color: var(--accent); }
  table.data td { border-bottom: 1px solid var(--border-soft); padding: 6px 10px; white-space: nowrap; }
  table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data td.wrap { white-space: normal; min-width: 180px; }
  table.data tbody tr { cursor: pointer; }
  table.data tbody tr:hover { background: var(--panel-2); }
  table.data .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .more { text-align: center; padding: 10px; }

  .tip {
    position: fixed; z-index: 50; pointer-events: none;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.22);
    max-width: 260px;
  }
  .tip b { font-weight: 600; }
  .tip .tv { color: var(--muted); }

  .empty { padding: 40px 24px; color: var(--faint); text-align: center; }
  .notice {
    margin: 24px; padding: 16px 18px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .notice code {
    display: block; margin: 8px 0; padding: 8px 10px; border-radius: 6px;
    background: var(--chip); font-size: 12.5px; overflow-x: auto;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); }

  @media (max-width: 980px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    .pane { max-height: 70vh; }
  }
</style>
</head>
<body>

<header>
  <div class="brandmark">Microphone Browser<small>recordinghacks dataset</small></div>
  <nav class="nav">
    <a class="navlink" id="navBrowse" href="#/">Browse</a>
    <a class="navlink" id="navStats" href="#/stats">Statistics</a>
  </nav>
  <input id="search" type="search" placeholder="Search brands and models…" autocomplete="off" spellcheck="false">
  <div class="patbar" id="patbar"></div>
  <div class="spacer"></div>
  <div class="stat" id="stat"></div>
  <button class="iconbtn" id="theme" title="Toggle theme">◐</button>
</header>

<main>
  <div class="pane">
    <div class="pane-head"><h2>Brands</h2><span class="sub" id="brandCount"></span></div>
    <div class="pane-body" id="tree"></div>
  </div>

  <div class="pane">
    <div class="pane-head"><h2 id="modelHead">Models</h2><span class="sub" id="modelCount"></span></div>
    <div class="filters" id="filters" hidden>
      <div class="frow">
        <button class="chip on" data-type="all">All</button>
        <button class="chip" data-type="condenser">Condenser</button>
        <button class="chip" data-type="dynamic">Dynamic</button>
        <button class="chip" data-type="ribbon">Ribbon</button>
        <button class="chip" data-type="boundary">Boundary</button>
        <select id="form" class="push" title="Form factor">
          <option value="all">Any form factor</option>
          <option value="side-address">Side-address</option>
          <option value="end-address">End-address</option>
          <option value="pencil">Pencil</option>
          <option value="handheld">Handheld</option>
          <option value="shotgun">Shotgun</option>
          <option value="boundary">Boundary</option>
          <option value="lavalier">Lavalier</option>
        </select>
      </div>
      <div class="frow">
        <select id="price" title="MSRP range">
          <option value="any">Any price</option>
          <option value="0-100">Under $100</option>
          <option value="100-300">$100 – $300</option>
          <option value="300-700">$300 – $700</option>
          <option value="700-1500">$700 – $1,500</option>
          <option value="1500-4000">$1,500 – $4,000</option>
          <option value="4000-">$4,000 and up</option>
          <option value="none">No price listed</option>
        </select>
        <button class="chip" data-trait="tube">Tube</button>
        <button class="chip" data-trait="multi">Multipattern</button>
        <button class="chip" data-trait="stereo">Stereo</button>
        <button class="chip" data-avail="current">Current</button>
        <button class="chip clear push" id="reset" hidden>Clear filters</button>
        <select id="sort">
          <option value="name">Name</option>
          <option value="price">Price ↑</option>
          <option value="price-desc">Price ↓</option>
          <option value="year">Newest</option>
        </select>
      </div>
    </div>
    <div class="pane-body" id="models"><div class="empty">Pick a brand</div></div>
  </div>

  <div class="pane">
    <div class="pane-head"><h2>Details</h2><span class="sub" id="detailSub"></span></div>
    <div class="pane-body" id="detail"><div class="empty">Pick a microphone</div></div>
  </div>
</main>

<section id="stats" class="statsview" hidden></section>
<div id="tip" class="tip" hidden></div>

<script>
"use strict";

/* ------------------------------------------------------------------ utils */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const has = (v) => v !== null && v !== undefined && v !== "" &&
  !(Array.isArray(v) && !v.length) && !(typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length);

const money = (n) => n == null ? null : "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
const num = (n, unit) => n == null ? null : (+n).toLocaleString(undefined, { maximumFractionDigits: 2 }) + (unit || "");
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* Scraped HTML: keep the markup, drop anything executable. */
function sanitize(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  tpl.content.querySelectorAll("script, style, iframe, object, embed, link, form").forEach((n) => n.remove());
  tpl.content.querySelectorAll("*").forEach((n) => {
    [...n.attributes].forEach((a) => {
      const name = a.name.toLowerCase();
      if (name.startsWith("on") || (/^(href|src)$/.test(name) && /^\s*javascript:/i.test(a.value))) {
        n.removeAttribute(a.name);
      }
    });
    if (n.tagName === "A") { n.target = "_blank"; n.rel = "noopener noreferrer"; }
  });
  return tpl.content;
}

/* --------------------------------------------------------- polar patterns */
/* Icons are the real polar equations sampled into a path, so the buttons show
   the shape each pattern actually has rather than a stylised stand-in. */
const TAU = Math.PI * 2;

function polarPath(r, opt) {
  const { rot = 0, scale = 1, steps = 120 } = opt || {};
  let d = "";
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * TAU;
    const rad = Math.max(0, r(t - rot)) * 11 * scale;
    const x = 12 + rad * Math.sin(t);
    const y = 12 - rad * Math.cos(t);
    d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
  }
  return d + "Z";
}

const R = {
  omni: () => 1,
  cardioid: (t) => 0.5 * (1 + Math.cos(t)),
  wide: (t) => 0.7 + 0.3 * Math.cos(t),
  super: (t) => Math.abs(0.37 + 0.63 * Math.cos(t)),
  hyper: (t) => Math.abs(0.25 + 0.75 * Math.cos(t)),
  fig8: (t) => Math.abs(Math.cos(t)),
  shotgun: (t) => Math.pow(Math.max(Math.cos(t), 0), 5) + 0.14 * Math.pow(Math.max(-Math.cos(t), 0), 3),
};

const icon = (paths) =>
  '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  paths.map((p) => '<path class="' + (p.stroke ? "strokep" : "fillp") + '" d="' + p.d + '"/>').join("") +
  "</svg>";

/* `match` lists the pattern names as they appear in the dataset. */
const PATTERNS = [
  { key: "cardioid", label: "Cardioid", match: ["Cardioid"],
    svg: icon([{ d: polarPath(R.cardioid) }]) },
  { key: "omni", label: "Omnidirectional", match: ["Omnidirectional"],
    svg: icon([{ d: polarPath(R.omni, { scale: 0.92 }) }]) },
  { key: "fig8", label: "Bidirectional (figure-8)", match: ["Bidirectional"],
    svg: icon([{ d: polarPath(R.fig8) }]) },
  { key: "super", label: "Supercardioid", match: ["Supercardioid"],
    svg: icon([{ d: polarPath(R.super) }]) },
  { key: "hyper", label: "Hypercardioid", match: ["Hypercardioid"],
    svg: icon([{ d: polarPath(R.hyper) }]) },
  { key: "wide", label: "Wide cardioid", match: ["Wide Cardioid"],
    svg: icon([{ d: polarPath(R.wide) }]) },
  { key: "shotgun", label: "Shotgun / lobar", match: ["Shotgun"],
    svg: icon([{ d: polarPath(R.shotgun) }]) },
  { key: "stereo", label: "Stereo (X/Y, M-S, Blumlein, binaural)",
    match: ["X/Y Stereo", "Mid-Side Stereo", "Blumlein", "Binaural"],
    svg: icon([
      { d: polarPath(R.cardioid, { rot: -0.75, scale: 0.8 }) },
      { d: polarPath(R.cardioid, { rot: 0.75, scale: 0.8 }) },
    ]) },
  { key: "multi", label: "Switchable / multipattern", multi: true,
    match: ["9 polar patterns", "continuously variable pattern selection"],
    svg: icon([
      { d: polarPath(R.cardioid, { scale: 0.66 }) },
      { d: polarPath(R.omni, { scale: 0.95 }), stroke: true },
    ]) },
];

const PATTERN_BY_KEY = new Map(PATTERNS.map((p) => [p.key, p]));

function renderPatternBar() {
  const bar = $("patbar");
  bar.innerHTML = "";
  for (const p of PATTERNS) {
    const b = el("button", "pat");
    b.type = "button";
    b.dataset.key = p.key;
    b.title = p.label;
    b.setAttribute("aria-label", p.label);
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = p.svg;
    bar.appendChild(b);
  }
}

/* A mic passes if it offers ANY of the selected patterns. */
function patternPass(m) {
  if (!state.patterns.size) return true;
  for (const key of state.patterns) {
    const p = PATTERN_BY_KEY.get(key);
    if (!p) continue;
    if (p.multi && m.multi) return true;
    if ((m.patterns || []).some((n) => p.match.includes(n))) return true;
  }
  return false;
}

/* ---------------------------------------------------------------- facets */
/* MSRP buckets, as [min, max) in dollars; "none" means the page listed no price. */
const PRICE_BANDS = {
  "0-100": [0, 100],
  "100-300": [100, 300],
  "300-700": [300, 700],
  "700-1500": [700, 1500],
  "1500-4000": [1500, 4000],
  "4000-": [4000, Infinity],
};

/* How many cards the all-brands list renders per page. */
const PAGE = 120;

function pricePass(m) {
  if (state.price === "any") return true;
  if (state.price === "none") return m.msrp == null;
  const band = PRICE_BANDS[state.price];
  if (!band) return true;
  return m.msrp != null && m.msrp >= band[0] && m.msrp < band[1];
}

/* Everything the facet controls ask of a model, AND-ed together. */
function facetPass(m) {
  if (state.type !== "all" && m.type !== state.type) return false;
  if (state.form !== "all" && m.form !== state.form) return false;
  if (state.currentOnly && m.avail !== "current") return false;
  for (const t of state.traits) if (!m[t]) return false;
  return pricePass(m);
}

function filtersActive() {
  return state.type !== "all" || state.form !== "all" || state.price !== "any" ||
    state.traits.size > 0 || state.currentOnly || state.patterns.size > 0;
}

function clearFilters() {
  state.type = "all";
  state.form = "all";
  state.price = "any";
  state.traits.clear();
  state.currentOnly = false;
  state.patterns.clear();
}

/* ------------------------------------------------------------------ state */
const state = {
  index: null,
  byBrand: new Map(),      // slug -> brand record from index
  brandData: new Map(),    // slug -> full records, lazily fetched
  query: "",
  patterns: new Set(),     // selected polar-pattern keys, OR-ed together
  brand: null,             // null = browse every brand at once
  model: null,
  type: "all",
  form: "all",
  price: "any",
  traits: new Set(),       // tube / multi / stereo, AND-ed together
  currentOnly: false,
  sort: "name",
  limit: PAGE,             // cards rendered so far in the all-brands list
};

/* ------------------------------------------------------------------- boot */
async function boot() {
  renderPatternBar();
  try {
    const res = await fetch("data/index.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.index = await res.json();
  } catch (err) {
    showLoadError(err);
    return;
  }
  state.index.brands.forEach((b) => state.byBrand.set(b.slug, b));
  $("stat").textContent =
    state.index.total_models.toLocaleString() + " mics · " + state.index.total_brands + " brands";
  renderTree();
  route();
}

function showLoadError(err) {
  const local = location.protocol === "file:";
  $("tree").innerHTML = "";
  const box = el("div", "notice");
  box.innerHTML = local
    ? "<b>Open this over HTTP.</b><p>Browsers block <code>fetch()</code> from <code>file://</code>, " +
      "so the data files can't load. From the repository root run:</p>" +
      "<code>python3 -m http.server -d docs 8000</code>" +
      "<p>then visit <a href='http://localhost:8000/'>http://localhost:8000/</a></p>"
    : "<b>Could not load data/index.json.</b><p>" + esc(err.message) +
      "</p><p>Generate the data files first:</p><code>python3 docs/build_data.py</code>";
  $("tree").appendChild(box);
}

/* -------------------------------------------------------------- brand tree */
const textPass = (m) => {
  const q = state.query;
  return !q || (m.model || "").toLowerCase().includes(q) || (m.subtitle || "").toLowerCase().includes(q);
};

/* Which models of a brand survive the search box, the pattern buttons and the
   facet controls — null means the brand itself drops out of the tree. */
function brandView(brand) {
  const q = state.query;
  const brandHit = !q || brand.name.toLowerCase().includes(q) || brand.slug.toLowerCase().includes(q);
  const models = brand.models.filter((m) =>
    patternPass(m) && facetPass(m) && (brandHit || textPass(m)));
  return models.length ? { brandHit, models } : null;
}

function renderTree() {
  const host = $("tree");
  host.innerHTML = "";
  const frag = document.createDocumentFragment();
  const filtering = !!state.query || filtersActive();
  let shownBrands = 0, shownModels = 0;

  /* Entry point for browsing the catalogue without committing to a brand. */
  const all = el("div", "brand");
  const allRow = el("div", "brand-row");
  allRow.append(
    el("div", "twisty"),
    el("div", "brand-name", "All microphones"),
    el("div", "count", String(state.index.total_models)));
  allRow.addEventListener("click", () => go(null));
  all.dataset.all = "1";
  all.appendChild(allRow);
  if (!state.brand) all.classList.add("sel");
  frag.appendChild(all);

  for (const brand of state.index.brands) {
    const hit = brandView(brand);
    if (!hit) continue;
    shownBrands++;
    shownModels += hit.models.length;

    const node = el("div", "brand");
    node.dataset.slug = brand.slug;
    if (state.brand === brand.slug) node.classList.add("sel", "open");
    // A text search narrows to a handful of brands, so open them; a pattern
    // filter alone still spans most of the list, so leave those collapsed.
    if (state.query && !hit.brandHit) node.classList.add("open");

    const row = el("div", "brand-row");
    const tw = el("div", "twisty", "▶");
    tw.addEventListener("click", (e) => { e.stopPropagation(); node.classList.toggle("open"); });
    const count = filtering && hit.models.length !== brand.count
      ? hit.models.length + "/" + brand.count
      : String(brand.count);
    row.append(tw, el("div", "brand-name", brand.name), el("div", "count", count));
    row.addEventListener("click", () => { node.classList.add("open"); go(brand.slug); });
    node.appendChild(row);

    const kidbox = el("div", "brand-kids");
    for (const m of hit.models) {
      const leaf = el("div", "leaf");
      leaf.dataset.slug = m.slug;
      if (state.brand === brand.slug && state.model === m.slug) leaf.classList.add("sel");
      leaf.append(el("span", "dot t-" + (m.type || "unknown")), el("span", null, m.model || m.slug));
      leaf.title = [m.model, m.subtitle].filter(Boolean).join(" — ");
      leaf.addEventListener("click", () => go(brand.slug, m.slug));
      kidbox.appendChild(leaf);
    }
    node.appendChild(kidbox);
    frag.appendChild(node);
  }

  host.appendChild(frag);
  if (!shownBrands) host.appendChild(el("div", "empty", "No matches"));
  $("brandCount").textContent = filtering
    ? shownBrands + " brands · " + shownModels + " models"
    : state.index.total_brands + " brands";
}

function syncTreeSelection() {
  document.querySelectorAll("#tree .brand").forEach((n) => {
    const on = n.dataset.all ? !state.brand : n.dataset.slug === state.brand;
    n.classList.toggle("sel", on);
    if (on) n.classList.add("open");
    n.querySelectorAll(".leaf").forEach((l) =>
      l.classList.toggle("sel", on && l.dataset.slug === state.model));
  });
  const sel = document.querySelector("#tree .leaf.sel") || document.querySelector("#tree .brand.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

/* -------------------------------------------------------------- model list */
/* Rows that survive search + patterns + facets, sorted. `brand` null sweeps the
   whole catalogue. Rows are {m, b} so the all-brands list can label its cards. */
function visibleModels(brand) {
  const q = state.query;
  const groups = brand ? [brand] : state.index.brands;
  const rows = [];
  for (const b of groups) {
    const brandHit = !q || b.name.toLowerCase().includes(q) || b.slug.toLowerCase().includes(q);
    for (const m of b.models) {
      if (!patternPass(m) || !facetPass(m)) continue;
      if (!brandHit && !textPass(m)) continue;
      rows.push({ m, b });
    }
  }
  const byName = (x, y) =>
    (x.m.model || "").localeCompare(y.m.model || "", undefined, { numeric: true });
  const byBrandName = (x, y) => x.b.name.localeCompare(y.b.name) || byName(x, y);
  const sorters = {
    name: brand ? byName : byBrandName,
    price: (x, y) => (x.m.msrp ?? Infinity) - (y.m.msrp ?? Infinity) || byName(x, y),
    "price-desc": (x, y) => (y.m.msrp ?? -1) - (x.m.msrp ?? -1) || byName(x, y),
    year: (x, y) => (y.m.year ?? -1) - (x.m.year ?? -1) || byName(x, y),
  };
  return rows.sort(sorters[state.sort] || byName);
}

function modelCard(m, brand, showBrand) {
  const card = el("div", "card");
  card.dataset.slug = m.slug;
  if (state.brand === brand.slug && state.model === m.slug) card.classList.add("sel");

  const thumb = el("div", "thumb");
  if (m.thumb) {
    const img = el("img");
    img.loading = "lazy";
    img.src = m.thumb;
    img.alt = "";
    img.addEventListener("error", () => img.remove());
    thumb.appendChild(img);
  }

  const info = el("div", "info");
  if (showBrand) info.appendChild(el("div", "brandline", brand.name));
  info.appendChild(el("div", "title", m.model || m.slug));
  if (m.subtitle) info.appendChild(el("div", "desc", m.subtitle));

  const meta = el("div", "meta");
  meta.appendChild(el("span", "tag type t-" + (m.type || "unknown"), cap(m.type || "unknown")));
  if (m.msrp != null) meta.appendChild(el("span", "tag price", money(m.msrp)));
  if (m.avail === "discontinued") meta.appendChild(el("span", "tag disc", "Discontinued"));
  if (m.tube) meta.appendChild(el("span", "tag", "Tube"));
  if (m.multi) meta.appendChild(el("span", "tag", "Multipattern"));
  if (m.stereo) meta.appendChild(el("span", "tag", "Stereo"));
  if (m.set) meta.appendChild(el("span", "tag", "Set"));
  if (m.year) meta.appendChild(el("span", "tag", String(m.year)));
  info.appendChild(meta);

  card.append(thumb, info);
  card.addEventListener("click", () => go(brand.slug, m.slug));
  return card;
}

function renderModels() {
  const host = $("models");
  const brand = state.byBrand.get(state.brand) || null;
  host.innerHTML = "";

  $("filters").hidden = false;
  $("modelHead").textContent = brand ? brand.name : "All microphones";

  const rows = visibleModels(brand);
  const total = brand ? brand.count : state.index.total_models;
  $("modelCount").textContent = rows.length === total
    ? total.toLocaleString() + " models"
    : rows.length.toLocaleString() + " of " + total.toLocaleString();

  if (!rows.length) { host.appendChild(el("div", "empty", "No models match the filters")); return; }

  /* The all-brands sweep can be 1,700 cards — hand them out a page at a time,
     appending in place so the scroll position survives "show more". */
  let drawn = 0;
  const more = el("button", "showmore");
  more.type = "button";

  const draw = () => {
    const stop = Math.min(drawn + PAGE, rows.length);
    const frag = document.createDocumentFragment();
    for (; drawn < stop; drawn++) {
      frag.appendChild(modelCard(rows[drawn].m, rows[drawn].b, !brand));
    }
    host.insertBefore(frag, more.isConnected ? more : null);
    state.limit = drawn;
    const left = rows.length - drawn;
    if (left) {
      more.textContent = "Show " + Math.min(PAGE, left) + " more · " + left.toLocaleString() + " left";
      if (!more.isConnected) host.appendChild(more);
    } else {
      more.remove();
    }
  };

  more.addEventListener("click", draw);
  const target = Math.min(Math.max(state.limit, PAGE), rows.length);
  while (drawn < target) draw();
}

/* ------------------------------------------------------------------ detail */
async function loadBrand(slug) {
  if (state.brandData.has(slug)) return state.brandData.get(slug);
  const file = state.byBrand.get(slug).file;
  const res = await fetch("data/brands/" + encodeURIComponent(file) + ".json");
  if (!res.ok) throw new Error("HTTP " + res.status + " loading " + file);
  const data = await res.json();
  state.brandData.set(slug, data);
  return data;
}

async function renderDetail() {
  const host = $("detail");
  $("detailSub").textContent = "";
  if (!state.brand || !state.model) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "Pick a microphone"));
    return;
  }
  host.innerHTML = "";
  host.appendChild(el("div", "empty", "Loading…"));

  let mic;
  try {
    mic = (await loadBrand(state.brand))[state.model];
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "Failed to load: " + err.message));
    return;
  }
  if (state.model !== mic.source.model_slug) return; // superseded by a newer click
  host.innerHTML = "";
  host.appendChild(buildDetail(mic));
  host.scrollTop = 0;
  $("detailSub").textContent = mic.source.mic_id ? "id " + mic.source.mic_id : "";
}

function section(title, body) {
  const s = el("section", "block");
  s.appendChild(el("h3", null, title));
  s.appendChild(body);
  return s;
}

function dl(pairs) {
  const d = el("dl", "kv");
  let n = 0;
  for (const [k, v] of pairs) {
    if (!has(v)) continue;
    d.appendChild(el("dt", null, k));
    if (v instanceof Node) { const dd = el("dd"); dd.appendChild(v); d.appendChild(dd); }
    else d.appendChild(el("dd", null, v));
    n++;
  }
  return n ? d : null;
}

function boxed(title, node) {
  if (!node) return null;
  const b = el("div", "box");
  b.appendChild(el("h3", null, title));
  b.lastChild.style.cssText = "margin:0 0 7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600";
  b.appendChild(node);
  return b;
}

function extLink(url, text) {
  const a = el("a", null, text || url);
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}

function buildDetail(mic) {
  const root = el("div", "detail");
  const id = mic.identity, cls = mic.classification, spec = mic.specifications || {};
  const price = mic.pricing || {}, content = mic.content || {}, media = mic.media || {}, links = mic.links || {};

  /* --- header + hero --- */
  root.appendChild(el("h1", null, id.full_name || id.model));
  if (cls.subtitle) root.appendChild(el("div", "sub", cls.subtitle));

  const hero = el("div", "hero");
  const photo = media.primary_photo;
  if (photo && (photo.full_url || photo.thumb_url)) {
    const box = el("div", "photo");
    const img = el("img");
    img.src = photo.thumb_url || photo.full_url;
    img.alt = photo.alt || id.full_name || "";
    img.addEventListener("error", () => box.remove());
    if (photo.full_url) { const a = extLink(photo.full_url, ""); a.appendChild(img); box.appendChild(a); }
    else box.appendChild(img);
    hero.appendChild(box);
  }

  const facts = el("div", "facts");
  const badges = el("div", "badges");
  badges.appendChild(el("span", "tag type t-" + (cls.transducer_type || "unknown"), cap(cls.transducer_type || "unknown")));
  if (cls.form_factor) badges.appendChild(el("span", "tag", cls.form_factor));
  if (cls.is_tube) badges.appendChild(el("span", "tag", "Tube"));
  if (cls.is_multipattern) badges.appendChild(el("span", "tag", "Multipattern"));
  if (cls.is_stereo) badges.appendChild(el("span", "tag", "Stereo"));
  if (cls.product_type === "set") badges.appendChild(el("span", "tag", "Set"));
  if (price.availability === "discontinued") badges.appendChild(el("span", "tag disc", "Discontinued"));
  (cls.pattern_icons || []).forEach((p) => badges.appendChild(el("span", "tag", p)));
  facts.appendChild(badges);

  if (price.msrp_amount != null) {
    const p = el("div", "price", money(price.msrp_amount));
    p.appendChild(el("small", null, " " + (price.currency || "") + (price.msrp_raw ? " · " + price.msrp_raw : "")));
    facts.appendChild(p);
  } else if (price.msrp_raw) {
    facts.appendChild(el("div", "price", price.msrp_raw));
  }

  const manuf = id.manufacturer_url ? extLink(id.manufacturer_url, id.manufacturer) : id.manufacturer;
  const head = dl([
    ["Manufacturer", manuf],
    ["Model", id.model],
    ["Released", content.release_year],
    ["Availability", cap(price.availability)],
    ["Source", mic.source.permalink ? extLink(mic.source.permalink, "recordinghacks.com") : null],
  ]);
  if (head) { head.style.marginTop = "10px"; facts.appendChild(head); }
  hero.appendChild(facts);
  root.appendChild(hero);

  /* --- description --- */
  if (content.description_html) {
    const p = el("div", "prose");
    p.appendChild(sanitize(content.description_html));
    root.appendChild(section("Description", p));
  } else if (content.description_text) {
    root.appendChild(section("Description", el("div", "prose", content.description_text)));
  }

  /* --- pickup patterns --- */
  if (has(spec.pickup_patterns)) {
    const wrap = el("div", "grid2");
    for (const p of spec.pickup_patterns) {
      const fr = p.frequency_response || {};
      const range = fr.low_hz != null && fr.high_hz != null
        ? num(fr.low_hz, " Hz") + " – " + num(fr.high_hz, " Hz")
        : fr.raw;
      const body = dl([
        ["Sensitivity", num(p.sensitivity_mv_pa, " mV/Pa")],
        ["Frequency", range],
        ["Variant", p.pattern_variant],
      ]) || el("div", "sub", p.raw || "—");
      const b = boxed(p.pattern || p.pattern_base || "Pattern", body);
      wrap.appendChild(b);
    }
    root.appendChild(section("Pickup patterns", wrap));
  }

  /* --- specifications --- */
  const specCards = el("div", "grid2");
  const push = (t, node) => { const b = boxed(t, node); if (b) specCards.appendChild(b); };

  if (spec.capsule) push("Capsule", dl([
    ["Diaphragm Ø", num(spec.capsule.diaphragm_diameter_mm, " mm")],
    ["Capsule Ø", num(spec.capsule.capsule_diameter_mm, " mm")],
    ["Gauge", num(spec.capsule.diaphragm_gauge_microns, " µm")],
    ["Raw", spec.capsule.raw],
  ]));
  if (spec.ribbon) push("Ribbon", dl([
    ["Material", spec.ribbon.material],
    ["Length", num(spec.ribbon.length_mm, " mm")],
    ["Width", num(spec.ribbon.width_mm, " mm")],
    ["Gauge", num(spec.ribbon.gauge_microns, " µm")],
    ["Detail", spec.ribbon.description || spec.ribbon.raw],
  ]));
  if (spec.coil) push("Voice coil", dl([
    ["Diameter", num(spec.coil.diameter_mm, " mm")],
    ["Raw", spec.coil.raw !== "n/a" ? spec.coil.raw : null],
  ]));
  if (spec.spl_noise) push("SPL & noise", dl([
    ["Max SPL", num(spec.spl_noise.max_spl_db, " dB")],
    ["SPL note", spec.spl_noise.max_spl_note],
    ["Self noise", num(spec.spl_noise.self_noise_dba, " dB-A")],
    ["Noise note", spec.spl_noise.self_noise_note],
  ]));
  if (spec.impedance) push("Impedance", dl([
    ["Output Z", num(spec.impedance.ohms, " Ω")],
    ["Category", spec.impedance.category],
    ["Raw", spec.impedance.ohms == null && spec.impedance.raw !== "n/a" ? spec.impedance.raw : null],
  ]));
  if (spec.physical) push("Physical", dl([
    ["Weight", spec.physical.weight && spec.physical.weight.raw !== "n/a" ? spec.physical.weight.raw : null],
    ["Length", spec.physical.length && spec.physical.length.raw !== "n/a" ? spec.physical.length.raw : null],
    ["Max Ø", spec.physical.max_diameter && spec.physical.max_diameter.raw !== "n/a" ? spec.physical.max_diameter.raw : null],
  ]));
  if (spec.power) {
    const v = spec.power.phantom_voltage_v;
    push("Power", dl([
      ["Phantom", spec.power.requires_phantom_power ? "Required" : (spec.power.requires_phantom_power === false ? "Not required" : null)],
      ["Voltage", Array.isArray(v) && v.length ? v.map((x) => x + "V").join(", ") : null],
      ["PSU", spec.power.includes_tube_power_supply ? "Tube PSU included" : null],
      ["Battery", spec.power.has_battery_compartment ? (spec.power.battery_type || "Yes") : null],
      ["Other", (spec.power.other || []).join("; ")],
    ]));
  }
  if (has(spec.interfaces)) {
    const ul = el("div");
    spec.interfaces.forEach((i) =>
      ul.appendChild(el("div", null, i.connector + (i.count > 1 ? " ×" + i.count : ""))));
    push("Connectors", ul);
  }
  if (has(spec.pads) || has(spec.filters)) {
    const ul = el("div");
    (spec.pads || []).forEach((p) => ul.appendChild(el("div", null, p.raw)));
    (spec.filters || []).forEach((f) => ul.appendChild(el("div", null, f.raw)));
    push("Pads & filters", ul);
  }
  if (has(spec.compatible_capsules)) {
    const ul = el("div");
    spec.compatible_capsules.forEach((c) => {
      const line = el("div", null, c.name || c.raw);
      if (c.url) { line.textContent = ""; line.appendChild(extLink(c.url, c.name || c.raw)); }
      ul.appendChild(line);
    });
    push("Compatible capsules", ul);
  }
  if (specCards.children.length) root.appendChild(section("Specifications", specCards));

  /* --- frequency graphs --- */
  if (has(mic.frequency_graphs)) {
    const wrap = el("div", "graphs");
    for (const g of mic.frequency_graphs) {
      const box = el("div", "graph");
      const img = el("img");
      img.loading = "lazy";
      img.src = g.image_url;
      img.alt = g.alt || "";
      img.addEventListener("error", () => box.remove());
      box.appendChild(g.compare_url ? (() => { const a = extLink(g.compare_url, ""); a.appendChild(img); return a; })() : img);
      box.appendChild(el("div", "cap", g.pattern || g.alt || ""));
      wrap.appendChild(box);
    }
    root.appendChild(section("Frequency response", wrap));
  }

  /* --- set contents --- */
  if (mic.set) {
    const wrap = el("div");
    if (has(mic.set.included_microphones)) {
      const rel = el("div", "rel");
      for (const m of mic.set.included_microphones) rel.appendChild(relCard(m, m.quantity_in_set));
      wrap.appendChild(rel);
    }
    const acc = mic.set.included_accessories || {};
    const accList = dl(Object.entries(acc).map(([k, v]) => [k.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()), v]));
    if (accList) { accList.style.marginTop = "10px"; wrap.appendChild(accList); }
    if (wrap.children.length) root.appendChild(section("Included in this set", wrap));
  }

  /* --- quotes --- */
  if (has(content.quotes)) {
    const wrap = el("div");
    for (const q of content.quotes) {
      const bq = el("blockquote", null, q.text);
      if (q.cite) bq.appendChild(el("cite", null, "— " + q.cite));
      wrap.appendChild(bq);
    }
    root.appendChild(section("Quotes", wrap));
  }

  /* --- related --- */
  if (has(mic.related_microphones)) {
    const rel = el("div", "rel");
    for (const r of mic.related_microphones) rel.appendChild(relCard(r));
    root.appendChild(section("Related microphones", rel));
  }

  /* --- links --- */
  const linkGroups = [
    ["Documentation", links.documentation],
    ["Reviews & news", links.reviews_news],
    ["Awards", links.awards],
    ["Related products", links.related_products],
    ["Capsules", media.capsule_links],
    ["Other", links.other],
  ].filter(([, v]) => has(v));
  if (linkGroups.length) {
    const wrap = el("div", "grid2");
    for (const [title, items] of linkGroups) {
      const ul = el("ul", "linklist");
      for (const l of items) {
        const li = el("li");
        li.appendChild(extLink(l.url, l.title || l.url));
        if (l.link_type && l.link_type !== "www") li.appendChild(el("span", "lt", l.link_type));
        ul.appendChild(li);
      }
      wrap.appendChild(boxed(title, ul));
    }
    root.appendChild(section("Links", wrap));
  }

  /* --- tags --- */
  if (has(cls.tags)) {
    const wrap = el("div", "badges");
    for (const t of cls.tags) {
      wrap.appendChild(el("span", "tag", typeof t === "string" ? t : t.name));
    }
    root.appendChild(section("Tags", wrap));
  }

  /* --- raw source tables --- */
  if (has(spec.raw_tables)) {
    const det = el("details", "rawdump");
    det.appendChild(el("summary", null, "Raw spec tables (" + spec.raw_tables.length + ")"));
    for (const t of spec.raw_tables) {
      const table = el("table", "raw");
      if (has(t.headers)) {
        const tr = el("tr");
        t.headers.forEach((h) => tr.appendChild(el("th", null, h)));
        table.appendChild(tr);
      }
      const cells = t.cells || [];
      const cols = (t.headers && t.headers.length) || cells.length || 1;
      for (let i = 0; i < cells.length; i += cols) {
        const tr = el("tr");
        for (let c = 0; c < cols; c++) tr.appendChild(el("td", null, cells[i + c] || ""));
        table.appendChild(tr);
      }
      table.style.marginTop = "8px";
      det.appendChild(table);
    }
    root.appendChild(section("Source data", det));
  }

  return root;
}

function relCard(item, qty) {
  const card = el("div", "rel-item");
  const img = el("img");
  const thumb = item.image && item.image.thumb_url;
  if (thumb) { img.loading = "lazy"; img.src = thumb; img.alt = ""; img.addEventListener("error", () => img.remove()); card.appendChild(img); }
  const n = el("div", "n", (qty && qty > 1 ? qty + "× " : "") + (item.name || item.title || ""));
  const note = item.relationship_note || item.subtitle;
  if (note) n.appendChild(el("span", null, note));
  card.appendChild(n);

  const target = parsePermalink(item.url);
  if (target) card.addEventListener("click", () => go(target.brand, target.model));
  else if (item.url) card.addEventListener("click", () => window.open(item.url, "_blank", "noopener"));
  return card;
}

/* recordinghacks.com/microphones/<brand>/<model> -> internal navigation */
function parsePermalink(url) {
  if (!url) return null;
  const m = /\/microphones\/([^\/?#]+)\/([^\/?#]+)\/?$/.exec(url);
  if (!m) return null;
  const brand = decodeURIComponent(m[1]);
  return state.byBrand.has(brand) ? { brand, model: decodeURIComponent(m[2]) } : null;
}

/* ----------------------------------------------------------------- routing */
function go(brand, model) {
  location.hash = brand
    ? "#/" + encodeURIComponent(brand) + (model ? "/" + encodeURIComponent(model) : "")
    : "#/";
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  const [brand, model] = parts;
  const next = state.byBrand.has(brand) ? brand : null;
  const brandChanged = next !== state.brand;
  state.brand = next;
  state.model = state.brand && model ? model : null;

  if (brandChanged) state.limit = PAGE;
  syncChips();
  renderModels();
  syncTreeSelection();
  const card = document.querySelector("#models .card.sel");
  if (card) card.scrollIntoView({ block: "nearest" });
  renderDetail();
}

function syncChips() {
  document.querySelectorAll("#filters .chip[data-type]").forEach((c) =>
    c.classList.toggle("on", c.dataset.type === state.type));
  document.querySelectorAll("#filters .chip[data-trait]").forEach((c) =>
    c.classList.toggle("on", state.traits.has(c.dataset.trait)));
  document.querySelectorAll("#filters .chip[data-avail]").forEach((c) =>
    c.classList.toggle("on", state.currentOnly));
  $("form").value = state.form;
  $("form").classList.toggle("on", state.form !== "all");
  $("price").value = state.price;
  $("price").classList.toggle("on", state.price !== "any");
  $("reset").hidden = !filtersActive();
  document.querySelectorAll("#patbar .pat").forEach((b) => {
    const on = state.patterns.has(b.dataset.key);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
}

/* ------------------------------------------------------------------ events */
let searchTimer;
$("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value.trim().toLowerCase();
  searchTimer = setTimeout(() => {
    state.query = v;
    applyFilters();
  }, 120);
});

$("patbar").addEventListener("click", (e) => {
  const btn = e.target.closest(".pat");
  if (!btn) return;
  const key = btn.dataset.key;
  if (state.patterns.has(key)) state.patterns.delete(key);
  else state.patterns.add(key);
  applyFilters();
});

/* Any facet change re-filters both panes and rewinds the paged list. */
function applyFilters() {
  state.limit = PAGE;
  syncChips();
  renderTree();
  syncTreeSelection();
  renderModels();
}

$("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  if (chip.id === "reset") clearFilters();
  else if (chip.dataset.type) state.type = chip.dataset.type;
  else if (chip.dataset.trait) {
    if (state.traits.has(chip.dataset.trait)) state.traits.delete(chip.dataset.trait);
    else state.traits.add(chip.dataset.trait);
  } else if (chip.dataset.avail) state.currentOnly = !state.currentOnly;
  applyFilters();
});

$("form").addEventListener("change", (e) => { state.form = e.target.value; applyFilters(); });
$("price").addEventListener("change", (e) => { state.price = e.target.value; applyFilters(); });

$("sort").addEventListener("change", (e) => {
  state.sort = e.target.value;
  state.limit = PAGE;
  renderModels();
});

$("theme").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "dark" ? "light" : now === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { next ? localStorage.setItem("mic-theme", next) : localStorage.removeItem("mic-theme"); } catch (e) {}
});
try {
  const saved = localStorage.getItem("mic-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}

window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && e.target !== $("search")) { e.preventDefault(); $("search").focus(); }
  if (e.key === "Escape" && e.target === $("search")) { $("search").value = ""; $("search").dispatchEvent(new Event("input")); $("search").blur(); }
});

boot();
</script>
</body>
</html>
