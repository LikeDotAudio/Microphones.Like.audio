<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microphone Browser</title>
<!--
  Structure only. Every style lives in css/app.css, every behaviour in js/, and
  every value the page offers — filter chips, dropdown options, table and CSV
  columns — is built at runtime from data/config.json. There is no vocabulary
  and no microphone data in this file; see docs/vocabulary.py for the source.
-->
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>

<header>
  <div class="brandmark">Microphone Browser</div>
  <nav class="nav">
    <a class="navlink" id="navBrowse" href="#/">Browse</a>
    <a class="navlink" id="navGallery" href="#/gallery">Gallery</a>
    <a class="navlink" id="navWireless" href="#/wireless">Wireless</a>
    <a class="navlink" id="navTags" href="#/tags">Tags</a>
    <a class="navlink" id="navStats" href="#/stats">Statistics</a>
    <a class="navlink" id="navX230" href="#/x230">X230</a>
  </nav>
  <input id="search" type="search" placeholder="Search brands and models…" autocomplete="off" spellcheck="false">
  <div class="patbar" id="patbar"></div>
  <div class="spacer"></div>
  <div class="stat" id="stat"></div>
  <button class="iconbtn" id="theme" title="Toggle theme">◐</button>
</header>

<!-- Above the panes, not inside one: these facets narrow the brand tree as
     much as the model list. Both rows are filled by js/controls.js from
     data/config.json. -->
<div class="filters" id="filters" hidden>
  <div class="frow" id="frowType"></div>
  <div class="frow" id="frowMore"></div>
</div>

<main>
  <div class="pane">
    <div class="pane-head"><h2>Brands</h2><span class="sub" id="brandCount"></span></div>
    <div class="pane-body" id="tree"></div>
  </div>

  <!-- Hidden on narrow screens: the brand tree already folds out to models. -->
  <div class="pane" id="modelPane">
    <div class="pane-head"><h2 id="modelHead">Models</h2><span class="sub" id="modelCount"></span></div>
    <div class="pane-body" id="models"><div class="empty">Loading…</div></div>
  </div>

  <div class="pane">
    <div class="pane-head"><h2>Details</h2><span class="sub" id="detailSub"></span></div>
    <div class="pane-body" id="detail"><div class="empty">Pick a microphone</div></div>
  </div>
</main>

<section id="tags" class="statsview" hidden>
  <div class="statswrap">
    <h2 class="vh">Tag vocabulary</h2>
    <div class="tagbar">
      <input id="tagSearch" type="search" placeholder="Filter tags…" autocomplete="off" spellcheck="false">
      <select id="tagSort" title="Sort tags"></select>
      <span class="stat" id="tagStat"></span>
    </div>
    <div class="taggrid" id="tagGrid"></div>
  </div>
</section>

<!-- Photos only, grouped by manufacturer; see js/gallery.js. -->
<section id="gallery" class="statsview" hidden>
  <div class="statswrap">
    <h2 class="vh">Gallery</h2>
    <div class="tagbar">
      <input id="galSearch" type="search" placeholder="Filter brands and models…" autocomplete="off" spellcheck="false">
      <span class="stat" id="galStat"></span>
    </div>
    <div id="galGrid"></div>
  </div>
</section>

<section id="wireless" class="statsview" hidden>
  <div class="statswrap">
    <h2 class="vh">Wireless systems</h2>
    <!-- Filters are filled by js/rfview.js from data/config.json. -->
    <div class="tagbar" id="rfFilters"></div>
    <div class="stat" id="rfStat"></div>
    <div class="rfaxis" id="rfAxis"></div>
    <div class="rflist" id="rfGrid"></div>
  </div>
</section>

<!-- Every word of this view comes from data/x230.json; see js/x230view.js. -->
<section id="x230" class="statsview" hidden></section>

<section id="stats" class="statsview" hidden></section>
<div id="tip" class="tip" hidden></div>

</body>
</html>
